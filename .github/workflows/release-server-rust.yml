name: Release server-rust binaries

# Tag the commit to release, e.g.:
#   git tag server-rust-v0.1.0 && git push origin server-rust-v0.1.0
# Builds the durable-streams-server binary for linux + macOS (x86_64 + arm64)
# and attaches the tarballs (+ SHA-256 checksums) to a GitHub Release.
#
# Uses only first-party tooling — rustup, cargo and the gh CLI are all
# preinstalled on the runners — so no third-party action touches the release
# token or artifacts. Each target builds natively on a matching runner, so no
# cross-compilation toolchain is needed. The only action is GitHub's own
# actions/checkout (pinned to a commit SHA).
on:
  push:
    tags:
      - "server-rust-v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag

  build:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked \
            --manifest-path packages/server-rust/Cargo.toml \
            --target ${{ matrix.target }}

      - name: Package and checksum
        run: |
          version="${GITHUB_REF_NAME#server-rust-}"
          archive="durable-streams-server-${version}-${{ matrix.target }}.tar.gz"
          bindir="packages/server-rust/target/${{ matrix.target }}/release"
          tar -czf "$RUNNER_TEMP/$archive" -C "$bindir" durable-streams-server
          shasum -a 256 "$RUNNER_TEMP/$archive" | sed "s|$RUNNER_TEMP/||" \
            > "$RUNNER_TEMP/$archive.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/*.tar.gz "$RUNNER_TEMP"/*.tar.gz.sha256 \
            --clobber
