[package]
name = "durable-streams-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust client for Durable Streams - persistent, resumable event streams over HTTP"
repository = "https://github.com/durable-streams/durable-streams"
keywords = ["streaming", "events", "http", "append-only-log"]
categories = ["network-programming", "web-programming"]
# Test-harness helpers, not part of the published library.
exclude = ["design.md", "run-conformance-adapter.sh"]

[lib]
# Published as `durable-streams-client`, but kept importable as `durable_streams`
# (the bare name is taken by the server binary on crates.io). This keeps all
# existing `use durable_streams::...` call sites, doctests, and README examples
# valid without source changes.
name = "durable_streams"

[features]
default = ["json", "rustls"]
json = []
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls"]
tracing = ["dep:tracing"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

# Bytes handling
bytes = "1"

# Fast mutex
parking_lot = "0.12"

# Error handling
thiserror = "2"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding (used by the library's iterator for base64-encoded payloads)
base64 = "0.22"

# Tracing (optional)
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "conformance-adapter"
path = "src/bin/conformance_adapter.rs"
